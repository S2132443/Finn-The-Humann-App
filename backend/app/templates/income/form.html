{% extends 'base.html' %}

{% block title %}Record Income{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Record Income</h1>
    <a href="/income" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="account_id" class="form-label">Account *</label>
                    <select class="form-select" id="account_id" name="account_id" required>
                        <option value="">Select account...</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}">
                            {{ account.name }} ({{ account.currency }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-6">
                    <label for="asset_id" class="form-label">Asset (Optional)</label>
                    <select class="form-select" id="asset_id" name="asset_id">
                        <option value="">Select asset...</option>
                        {% for asset in assets %}
                        <option value="{{ asset.id }}">{{ asset.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-6">
                    <label for="income_type" class="form-label">Income Type *</label>
                    <select class="form-select" id="income_type" name="income_type" required>
                        <option value="">Select type...</option>
                        <option value="dividend">Dividend</option>
                        <option value="interest">Interest</option>
                        <option value="rental">Rental</option>
                        <option value="distribution">Distribution</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="col-md-3">
                    <label for="amount" class="form-label">Amount *</label>
                    <input type="number" class="form-control" id="amount" name="amount" 
                           step="0.01" required placeholder="0.00">
                </div>
                
                <div class="col-md-3">
                    <label for="currency" class="form-label">Currency</label>
                    <select class="form-select" id="currency" name="currency">
                        <option value="MYR" selected>MYR</option>
                        <option value="USD">USD</option>
                        <option value="SGD">SGD</option>
                    </select>
                </div>
                
                <div class="col-md-6">
                    <label for="income_date" class="form-label">Date *</label>
                    <input type="date" class="form-control" id="income_date" name="income_date" required>
                </div>
                
                <div class="col-md-6">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" id="is_reinvested" name="is_reinvested">
                        <label class="form-check-label" for="is_reinvested">
                            Income was reinvested
                        </label>
                    </div>
                </div>
                
                <div class="col-12">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="2"
                              placeholder="Optional notes about this income"></textarea>
                </div>
            </div>
            
            <hr class="my-4">
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Record Income
                </button>
                <a href="/income" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Set default date to today
if (!document.getElementById('income_date').value) {
    document.getElementById('income_date').valueAsDate = new Date();
}
</script>
{% endblock %}
