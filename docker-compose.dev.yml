# Dev override: live-reload backend + Vite dev server for the frontend.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# - Backend reuses the prod image (built once, cached) but bind-mounts
#   ./backend over the baked copy and runs uvicorn with --reload, so Python
#   edits apply instantly without rebuilding.
# - Frontend runs `npm run dev` in a node:20-alpine container with HMR.
#   Access the app on http://localhost:3000 — Vite proxies /api to backend:8000.
# - The PWA service worker is disabled in dev (see frontend/vite.config.ts),
#   so no stale caches mask new builds.
services:
  backend:
    volumes:
      - ./backend:/app/backend
    environment:
      DEBUG: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend

  frontend:
    image: node:20-alpine
    container_name: finn_frontend
    working_dir: /app/frontend
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
    driver: local
