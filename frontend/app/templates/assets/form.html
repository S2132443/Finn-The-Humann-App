{% extends 'base.html' %}

{% block title %}{{ 'Edit' if asset else 'Add' }} Asset{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">{{ 'Edit' if asset else 'Add' }} Asset</h1>
    <a href="{{ url_for('assets.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Asset Name *</label>
                    <input type="text" class="form-control" id="name" name="name" 
                           value="{{ asset.name if asset else '' }}" required
                           placeholder="e.g., Apple Inc, Gold Bar, Bitcoin">
                </div>
                
                <div class="col-md-6">
                    <label for="symbol" class="form-label">Symbol / Ticker</label>
                    <input type="text" class="form-control" id="symbol" name="symbol" 
                           value="{{ asset.symbol if asset else '' }}"
                           placeholder="e.g., AAPL, BTC, XAUUSD">
                </div>
                
                <div class="col-md-6">
                    <label for="account_id" class="form-label">Account *</label>
                    <select class="form-select" id="account_id" name="account_id" required>
                        <option value="">Select account...</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" 
                                {% if asset and asset.account_id == account.id %}selected{% endif %}>
                            {{ account.name }} ({{ account.currency }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-6">
                    <label for="asset_class_id" class="form-label">Asset Class</label>
                    <select class="form-select" id="asset_class_id" name="asset_class_id">
                        <option value="">Select class...</option>
                        {% for cls in asset_classes %}
                        <option value="{{ cls.id }}" 
                                {% if asset and asset.asset_class_id == cls.id %}selected{% endif %}>
                            {{ cls.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-4">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" 
                           value="{{ asset.quantity if asset else '' }}" step="any"
                           placeholder="e.g., 100, 0.5">
                </div>
                
                <div class="col-md-4">
                    <label for="current_value" class="form-label">Current Value *</label>
                    <input type="number" class="form-control" id="current_value" name="current_value" 
                           value="{{ asset.current_value if asset else '' }}" step="0.01" required
                           placeholder="Total market value">
                </div>
                
                <div class="col-md-4">
                    <label for="currency" class="form-label">Currency</label>
                    <select class="form-select" id="currency" name="currency">
                        {% for curr in currencies %}
                        <option value="{{ curr.code }}" 
                                {% if (asset and asset.currency == curr.code) or (not asset and curr.code == 'MYR') %}selected{% endif %}>
                            {{ curr.code }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-6">
                    <label for="cost_basis" class="form-label">Cost Basis</label>
                    <input type="number" class="form-control" id="cost_basis" name="cost_basis" 
                           value="{{ asset.cost_basis if asset else '' }}" step="0.01"
                           placeholder="Original purchase price">
                </div>
                
                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="2"
                              placeholder="Optional notes about this asset">{{ asset.notes if asset else '' }}</textarea>
                </div>
            </div>
            
            <hr class="my-4">
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> {{ 'Update' if asset else 'Create' }} Asset
                </button>
                <a href="{{ url_for('assets.index') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
