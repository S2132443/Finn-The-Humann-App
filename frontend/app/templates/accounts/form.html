{% extends 'base.html' %}

{% block title %}{{ 'Edit' if account else 'Add' }} Account{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">{{ 'Edit' if account else 'Add' }} Account</h1>
    <a href="{{ url_for('accounts.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Account Name *</label>
                    <input type="text" class="form-control" id="name" name="name" 
                           value="{{ account.name if account else '' }}" required>
                </div>
                
                <div class="col-md-6">
                    <label for="institution" class="form-label">Institution</label>
                    <input type="text" class="form-control" id="institution" name="institution" 
                           value="{{ account.institution if account else '' }}"
                           placeholder="e.g., Maybank, CIMB, Rakuten">
                </div>
                
                <div class="col-md-6">
                    <label for="account_type_id" class="form-label">Account Type</label>
                    <select class="form-select" id="account_type_id" name="account_type_id">
                        <option value="">Select type...</option>
                        {% for type in account_types %}
                        <option value="{{ type.id }}" 
                                {% if account and account.account_type_id == type.id %}selected{% endif %}>
                            {{ type.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-6">
                    <label for="currency" class="form-label">Currency</label>
                    <select class="form-select" id="currency" name="currency">
                        {% for curr in currencies %}
                        <option value="{{ curr.code }}" 
                                {% if (account and account.currency == curr.code) or (not account and curr.code == 'MYR') %}selected{% endif %}>
                            {{ curr.code }} - {{ curr.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-12">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="2"
                              placeholder="Optional notes about this account">{{ account.description if account else '' }}</textarea>
                </div>
                
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="is_liability" name="is_liability"
                               {% if account and account.is_liability %}checked{% endif %}>
                        <label class="form-check-label" for="is_liability">
                            This is a liability (e.g., loan, mortgage, credit card)
                        </label>
                    </div>
                </div>
            </div>
            
            <hr class="my-4">
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> {{ 'Update' if account else 'Create' }} Account
                </button>
                <a href="{{ url_for('accounts.index') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
