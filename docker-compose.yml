services:
  db:
    image: postgres:15-alpine
    container_name: finn_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-finn_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-finn_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI serves both /api/v1/* and the built React SPA (frontend/dist).
  # Build context is the repo root so the Dockerfile can see frontend/ for
  # the multi-stage build.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finn_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-finn_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      BASE_CURRENCY: ${BASE_CURRENCY:-MYR}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LUNO_API_KEY_ID: ${LUNO_API_KEY_ID:-}
      LUNO_API_KEY_SECRET: ${LUNO_API_KEY_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: finn_network
